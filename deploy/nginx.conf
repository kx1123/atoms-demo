worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  # Host edge proxy enters through the dedicated Docker network gateway.
  # Confirm this address with `docker network inspect atoms-demo_atoms`.
  set_real_ip_from 192.168.0.1;
  real_ip_header X-Real-IP;
  limit_req_zone $binary_remote_addr zone=api:1m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=generation:1m rate=6r/m;
  limit_conn_zone $binary_remote_addr zone=connections:1m;
  server {
    listen 8080;
    client_max_body_size 160k;
    limit_conn connections 24;
    limit_req_status 429;
    location ~ ^/api/projects/[^/]+/runs$ {
      limit_req zone=generation burst=2 nodelay;
      proxy_pass http://app:3000;
      include /etc/nginx/atoms-proxy.conf;
    }
    location / {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://app:3000;
      include /etc/nginx/atoms-proxy.conf;
    }
  }
}
